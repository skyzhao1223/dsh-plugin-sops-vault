# Opt-in overlay that mounts dsh-plugin-sops-vault over a `dsh web` composition:
#
#   dsh web --patch /path/to/dsh-plugin-sops-vault/cordis.yml
#
# The relative path resolves against this file's directory, so the plugin loads
# straight from a built checkout (run `pnpm build` first). For a published
# package, replace the name with `dsh-plugin-sops-vault` after installing it into
# the dsh installation tree.
#
# Config keys (all optional):
#   vaultDir        Vault repository directory     (default: ~/Vault)
#   sopsBin         sops binary                    (default: sops, via PATH)
#   gitBin          git binary                     (default: git, via PATH)
#   timeoutMs       per-command timeout            (default: 15000)
#   browserDataDir  extra Chromium user-data root for the Authenticator import
#                   (default: empty = platform auto-discovery only)
- insert:
    - id: vault-panel
      name: './lib/index.js'
      # config:
      #   vaultDir: ~/Vault
      #   browserDataDir: ~/Library/Application Support/Google/Chrome
